spring:
  application:
    name: houyu-common-log
  redis:
    uri: redis://localhost:63790

server:
  port: 9000

redisson:
  config:
    singleServerConfig:
      address: redis://localhost:63790
      database: 0
      connectionMinimumIdleSize: 10
      connectionPoolSize: 64
      idleConnectionTimeout: 10000
      pingTimeout: 1000
      connectTimeout: 10000
      timeout: 3000
      retryAttempts: 3
      retryInterval: 1500
